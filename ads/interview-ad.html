<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PsychometricCoach — AI Interview Panel</title>
<style>
  :root{--navy:#1B365D;--navy2:#2a4d80;--gold:#D4AF37;--ink:#212529;}
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins','Segoe UI',system-ui,sans-serif;}
  html,body{height:100%;overflow:hidden;background:var(--navy);}
  .stage{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(900px 500px at 20% -10%,#26548c 0%,transparent 55%),radial-gradient(700px 500px at 100% 110%,#0e1e37 0%,transparent 55%),linear-gradient(160deg,#1B365D,#0e1e37);
    color:#fff;text-align:center;padding:24px;}
  .badge{background:var(--gold);color:var(--navy);font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:6px 16px;border-radius:30px;
    opacity:0;animation:fadeUp .6s ease .2s forwards;}
  .avatar{width:150px;height:150px;border-radius:50%;border:4px solid var(--gold);object-fit:cover;margin:22px 0 6px;
    box-shadow:0 12px 40px rgba(0,0,0,.45);opacity:0;transform:scale(.6);animation:pop .7s cubic-bezier(.2,1.3,.4,1) .5s forwards, nod 2.6s ease-in-out 1.4s infinite;}
  .role{font-size:15px;color:var(--gold);font-weight:700;opacity:0;animation:fadeUp .5s ease .8s forwards;}
  .qwrap{position:relative;max-width:560px;margin:22px 0 8px;}
  .bubble{background:#fff;color:var(--ink);border-radius:18px;padding:20px 22px;font-size:clamp(17px,3.6vw,24px);font-weight:600;line-height:1.45;
    box-shadow:0 10px 40px rgba(0,0,0,.35);opacity:0;transform:translateY(14px);animation:fadeUp .6s ease 1.2s forwards;position:relative;}
  .bubble:before{content:'';position:absolute;top:-11px;left:50%;transform:translateX(-50%);border-left:11px solid transparent;border-right:11px solid transparent;border-bottom:12px solid #fff;}
  .typing{display:inline-block;color:var(--gold);animation:blink 1s steps(1) infinite;}
  .cta{margin-top:26px;display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:var(--navy);font-weight:800;font-size:clamp(16px,3.6vw,20px);
    padding:16px 34px;border-radius:16px;text-decoration:none;opacity:0;animation:fadeUp .6s ease 2.6s forwards, pulse 1.8s ease-in-out 3.4s infinite;}
  .tagline{margin-top:14px;font-size:13px;color:#cdd8ec;opacity:0;animation:fadeUp .5s ease 3s forwards;}
  .logo{position:absolute;top:20px;left:24px;font-weight:900;font-size:15px;color:#fff;opacity:.85;letter-spacing:.5px;}
  .logo b{color:var(--gold);}
  @keyframes fadeUp{to{opacity:1;transform:none;}}
  @keyframes pop{to{opacity:1;transform:scale(1);}}
  @keyframes nod{0%,100%{transform:translateY(0) rotate(0);}25%{transform:translateY(-4px) rotate(-2deg);}50%{transform:translateY(2px);}75%{transform:translateY(-4px) rotate(2deg);}}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.5);}50%{box-shadow:0 0 0 14px rgba(212,175,55,0);}}
  @keyframes blink{50%{opacity:0;}}
</style>
</head>
<body>
  <div class="stage">
    <div class="logo">Psychometric<b>Coach</b></div>
    <div class="badge" id="cat">Technical Interview</div>
    <img class="avatar" id="av" src="/panelists/tech_lead.jpg" alt="Interviewer" />
    <div class="role" id="role">Technical Lead asks…</div>
    <div class="qwrap">
      <div class="bubble" id="q">Loading…<span class="typing">▌</span></div>
    </div>
    <a class="cta" id="cta" href="https://www.psychometriccoach.com/register">Answer this → Sign up free</a>
    <div class="tagline">Face 4 AI interviewers · instant STAR scoring · voice or text</div>
  </div>
<script>
  const ADS = {
    tech:    { cat:'Technical Interview', avatar:'tech_lead.jpg',      role:'Technical Lead asks…',    q:'How would you design a system to handle a 10x increase in traffic overnight?' },
    hr:      { cat:'HR & Culture Interview', avatar:'hr_manager.jpg',  role:'HR &amp; Culture Manager asks…', q:'Tell me about a time you turned a conflict with a colleague into a win.' },
    product: { cat:'Product Interview',  avatar:'product_manager.jpg', role:'Product Manager asks…',   q:'You have two urgent features and time for one. How do you decide?' },
    exec:    { cat:'Executive Interview', avatar:'exec_director.jpg',  role:'Executive Director asks…', q:'How would your work here move the wider strategy of the business?' },
  };
  const key = new URLSearchParams(location.search).get('c') || 'tech';
  const a = ADS[key] || ADS.tech;
  document.getElementById('cat').textContent = a.cat;
  document.getElementById('av').src = '/panelists/' + a.avatar;
  document.getElementById('role').innerHTML = a.role;
  // typewriter question
  const qEl = document.getElementById('q');
  setTimeout(() => {
    qEl.innerHTML = '';
    let i = 0; const txt = a.q;
    const tw = setInterval(() => {
      qEl.innerHTML = txt.slice(0, ++i) + '<span class="typing">▌</span>';
      if (i >= txt.length) { clearInterval(tw); qEl.innerHTML = txt; }
    }, 34);
  }, 1300);
</script>
</body>
</html>
